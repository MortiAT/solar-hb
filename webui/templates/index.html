<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webui solar-hb</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .header .date {
            color: #666;
            font-size: 14px;
            margin-top: 6px;
        }

        .date-controls {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }

        .date-nav-button {
            border: 1px solid #d9d9d9;
            background: #fff;
            color: #333;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
        }

        .date-nav-button:hover {
            background: #f5f5f5;
        }

        .date-label {
            color: #666;
            font-size: 14px;
            font-weight: 600;
        }

        .date-input {
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 14px;
            color: #333;
        }

        .download-button {
            border: 1px solid #d9d9d9;
            background: #fff;
            color: #333;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .download-button:hover {
            background: #f5f5f5;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #f8f8f8;
            padding: 5px;
            border-radius: 8px;
            margin-left: -30px;
            margin-right: -30px;
            margin-top: -30px;
            padding-left: 30px;
            padding-right: 30px;
            padding-top: 20px;
            margin-bottom: 20px;
        }

        .tab-button {
            padding: 10px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            color: #333;
            border-bottom-color: #ff6b6b;
        }

        .tab-button:hover {
            color: #333;
        }

        .range-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            border-radius: 8px;
            padding: 25px;
            margin: 0;
            width: min(420px, calc(100% - 30px));
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .range-dialog::backdrop {
            background: rgba(0, 0, 0, 0.35);
        }

        .range-dialog h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

        .range-fields {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .range-field {
            display: grid;
            gap: 5px;
            color: #555;
            font-size: 14px;
        }

        .range-field input {
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 14px;
        }

        .range-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .range-dialog-actions button {
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
        }

        .range-dialog-actions .primary {
            border-color: #ff6b6b;
            background: #ff6b6b;
            color: white;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 40px;
            background: white;
        }

        .chart-wrapper {
            position: relative;
            height: 100%;
            width: 100%;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card.erzeugen {
            background: linear-gradient(135deg, #ffa500 0%, #ff8c00 100%);
            color: white;
        }

        .stat-card.eigennutzung {
            background: linear-gradient(135deg, #ffeb3b 0%, #fbc02d 100%);
            color: #333;
        }

        .stat-card.verbrauch {
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            color: white;
        }

        .stat-card.ladezustand {
            background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
            color: white;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 500;
            opacity: 0.85;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-unit {
            font-size: 11px;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat-value {
                font-size: 22px;
            }

            .tabs {
                margin-left: -20px;
                margin-right: -20px;
                padding-left: 20px;
                padding-right: 20px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 20px;
            }

            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body data-postgrest-url="{{ postgrest_url }}">
    <div class="container">
        <div class="header">
            <h1>PV Daten</h1>
            <div class="date-controls">
                <button class="date-nav-button" type="button" id="prevDayButton" aria-label="Vorheriger Tag">←</button>
                <label class="date-label" for="selectedDate">Datum:</label>
                <input class="date-input" type="date" id="selectedDate">
                <button class="download-button" type="button" id="downloadCsvButton">CSV herunterladen</button>
                <button class="date-nav-button" type="button" id="nextDayButton" aria-label="Nächster Tag">→</button>
            </div>
            <div class="date" id="currentDate"></div>
        </div>

        <div class="tabs">
            <button class="tab-button active" data-tab="day">Tag</button>
            <button class="tab-button" data-tab="month" disabled style="opacity: 0.5; cursor: not-allowed;">Monat</button>
            <button class="tab-button" data-tab="year" disabled style="opacity: 0.5; cursor: not-allowed;">Jahr</button>
            <button class="tab-button" data-tab="total" disabled style="opacity: 0.5; cursor: not-allowed;">Gesamt</button>
            <button class="tab-button" type="button" id="rangeDownloadButton">Zeitraum herunterladen</button>
        </div>

        <dialog class="range-dialog" id="rangeDialog">
            <form id="rangeDownloadForm">
                <h2>Zeitraum herunterladen</h2>
                <div class="range-fields">
                    <label class="range-field" for="rangeStartDate">
                        Von
                        <input type="date" id="rangeStartDate" required>
                    </label>
                    <label class="range-field" for="rangeEndDate">
                        Bis
                        <input type="date" id="rangeEndDate" required>
                    </label>
                </div>
                <div class="range-dialog-actions">
                    <button type="button" id="closeRangeDialogButton">Abbrechen</button>
                    <button class="primary" type="submit">CSV herunterladen</button>
                </div>
            </form>
        </dialog>

        <div id="error" class="error" style="display: none;"></div>

        <div class="chart-container">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Daten laden...</p>
            </div>
            <div id="chartWrapper" class="chart-wrapper" style="display: none;">
                <canvas id="energyChart"></canvas>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card erzeugen">
                <div class="stat-label">Erzeugung</div>
                <div class="stat-value" id="erzeugen">-</div>
                <div class="stat-unit">W</div>
            </div>
            <div class="stat-card eigennutzung">
                <div class="stat-label">Eigennutzung</div>
                <div class="stat-value" id="eigennutzung">-</div>
                <div class="stat-unit">W</div>
            </div>
            <div class="stat-card verbrauch">
                <div class="stat-label">Verbrauch</div>
                <div class="stat-value" id="verbrauch">-</div>
                <div class="stat-unit">W</div>
            </div>
            <div class="stat-card ladezustand">
                <div class="stat-label">Ladezustand</div>
                <div class="stat-value" id="ladezustand">-</div>
                <div class="stat-unit">%</div>
            </div>
        </div>
    </div>

    <script>
        const POSTGREST_URL = document.body.dataset.postgrestUrl || "http://localhost:3000";
        let chart = null;

        function getSelectedDate() {
            const input = document.getElementById('selectedDate');
            return input?.value || new Date().toISOString().slice(0, 10);
        }

        function setSelectedDate(dateString) {
            const input = document.getElementById('selectedDate');
            if (input) {
                input.value = dateString;
            }
        }

        function shiftSelectedDate(days) {
            const selectedDate = getSelectedDate();
            const [year, month, day] = selectedDate.split('-').map(Number);
            const currentDate = new Date(Date.UTC(year, month - 1, day));
            currentDate.setUTCDate(currentDate.getUTCDate() + days);
            const nextDate = `${currentDate.getUTCFullYear()}-${String(currentDate.getUTCMonth() + 1).padStart(2, '0')}-${String(currentDate.getUTCDate()).padStart(2, '0')}`;
            setSelectedDate(nextDate);
            updateCurrentDate();
            loadData();
        }

        function updateCurrentDate() {
            const selectedDate = getSelectedDate();
            const [year, month, day] = selectedDate.split('-').map(Number);
            const date = new Date(Date.UTC(year, month - 1, day));
            const options = { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'UTC' };
            const formatted = date.toLocaleDateString('de-DE', options);
            document.getElementById('currentDate').textContent = `Anzeige: ${formatted}`;
        }

        function parseTime(value) {
            if (!value) return null;
            if (value instanceof Date) return value;

            const normalized = String(value).replace('Z', '+00:00');
            const parsed = new Date(normalized);
            return Number.isNaN(parsed.getTime()) ? null : parsed;
        }

        function toNumber(value) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function formatHourLabel(value) {
            const numericValue = Number(value);
            const hour = Math.max(0, Math.min(24, Math.floor(numericValue)));
            const minutes = Math.max(0, Math.min(59, Math.round((numericValue - Math.floor(numericValue)) * 60)));
            return `${String(hour).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        function buildSeriesUrl() {
            const selectedDate = getSelectedDate();
            const url = new URL(`${POSTGREST_URL}/rpc/get_sensor_data_for_day`);
            url.searchParams.append('day_str', selectedDate);
            return url.toString();
        }

        function buildRangeDownloadUrl(startDate, endDate) {
            const url = new URL(`${POSTGREST_URL}/rpc/get_sensor_data_for_range`);
            url.searchParams.append('day_start', startDate);
            url.searchParams.append('day_end', endDate);
            return url.toString();
        }

        function buildDateRangeUrl() {
            return `${POSTGREST_URL}/rpc/get_sensor_data_date_range`;
        }

        async function downloadCsv() {
            const response = await fetch(buildSeriesUrl(), { headers: { Accept: 'text/csv' } });
            if (!response.ok) throw new Error('CSV-Download fehlgeschlagen');

            const csvBlob = await response.blob();
            const downloadUrl = URL.createObjectURL(csvBlob);
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = `pv-daten-${getSelectedDate()}.csv`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(downloadUrl);
        }

        async function downloadRangeCsv(startDate, endDate) {
            const response = await fetch(buildRangeDownloadUrl(startDate, endDate), {
                headers: { Accept: 'text/csv' }
            });
            if (!response.ok) throw new Error('CSV-Download fehlgeschlagen');

            const csvBlob = await response.blob();
            const downloadUrl = URL.createObjectURL(csvBlob);
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = `pv-daten-${startDate}-bis-${endDate}.csv`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(downloadUrl);
        }

        async function loadAvailableDateRange(startInput, endInput) {
            const response = await fetch(buildDateRangeUrl(), {
                headers: { Accept: 'application/json' }
            });
            if (!response.ok) throw new Error('Zeitraum konnte nicht geladen werden');

            const rows = await response.json();
            const dateRange = rows[0];
            if (!dateRange?.earliest_date || !dateRange?.latest_date) {
                throw new Error('Ungültiger Zeitraum vom Server');
            }

            startInput.min = dateRange.earliest_date;
            startInput.max = dateRange.latest_date;
            endInput.min = dateRange.earliest_date;
            endInput.max = dateRange.latest_date;
            startInput.value = dateRange.earliest_date;
            endInput.value = dateRange.latest_date;
        }

        async function loadData() {
            const loading = document.getElementById('loading');
            const chartWrapper = document.getElementById('chartWrapper');
            const errorDiv = document.getElementById('error');

            loading.style.display = 'block';
            chartWrapper.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch(buildSeriesUrl(), { headers: { Accept: 'application/json' } });
                if (!response.ok) throw new Error('Datenladevorgang fehlgeschlagen');

                const rows = await response.json();
                const data = {
                    erzeugen: [],
                    eigennutzung: [],
                    verbrauch: [],
                    ladezustand: [],
                    latest: {},
                };

                rows.forEach((row) => {
                    const timeObj = parseTime(row.time);
                    const pPv = toNumber(row.p_pv);
                    const pLoad = toNumber(row.p_load);
                    const relativeCharge = toNumber(row.relative_charge);
                    const eigener = Math.min(pPv, pLoad);

                    if (!timeObj) return;

                    const hourValue = timeObj.getHours() + (timeObj.getMinutes() / 60) + (timeObj.getSeconds() / 3600);

                    data.erzeugen.push({ x: hourValue, y: pPv });
                    data.eigennutzung.push({ x: hourValue, y: Math.abs(eigener) });
                    data.verbrauch.push({ x: hourValue, y: Math.abs(pLoad) });
                    data.ladezustand.push({ x: hourValue, y: relativeCharge });
                });

                data.erzeugen.sort((a, b) => a.x - b.x);
                data.eigennutzung.sort((a, b) => a.x - b.x);
                data.verbrauch.sort((a, b) => a.x - b.x);
                data.ladezustand.sort((a, b) => a.x - b.x);

                console.log("data", data)

                // TODO: fetch data from api more frequently and from source                
                if (rows.length > 0) {
                    const lastRow = rows[rows.length - 1];
                    const lastPv = toNumber(lastRow.p_pv);
                    const lastLoad = toNumber(lastRow.p_load);
                    const lastCharge = toNumber(lastRow.relative_charge);

                    data.latest = {
                        erzeugen: Number(lastPv.toFixed(2)),
                        eigennutzung: Number(Math.abs(Math.min(lastPv, lastLoad)).toFixed(2)),
                        verbrauch: Number(Math.abs(lastLoad).toFixed(2)),
                        ladezustand: Number(lastCharge.toFixed(1)),
                    };
                }

                loading.style.display = 'none';
                chartWrapper.style.display = 'block';

                renderChart(data);
                updateStats(data.latest);
            } catch (error) {
                loading.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Fehler beim Laden der Daten: ' + error.message;
                console.error(error);
            }
        }

        function renderChart(data) {
            const ctx = document.getElementById('energyChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Verbrauch',
                            data: data.verbrauch,
                            fill: false,
                            borderColor: 'rgba(140, 186, 210, 1)',
                            borderWidth: 2,
                            tension: 0.3,
                            pointRadius: 0,
                            spanGaps: true,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Ladezustand',
                            data: data.ladezustand,
                            fill: false,
                            borderColor: 'rgba(47, 160, 63, 1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            spanGaps: true,
                            yAxisID: 'y1'
                        },
                        {
                            label: 'Eigennutzung',
                            data: data.eigennutzung,
                            fill: true,
                            backgroundColor: 'rgba(255, 224, 1, 1.0)',
                            tension: 0.4,
                            pointRadius: 0,
                            borderWidth: 0,
                            spanGaps: true,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Erzeugung',
                            data: data.erzeugen,
                            fill: true,
                            backgroundColor: 'rgba(255, 180, 0, 1.0)',
                            tension: 0.4,
                            pointRadius: 0,
                            borderWidth: 0,
                            spanGaps: true,
                            yAxisID: 'y'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 15,
                                font: { size: 12, weight: '500' },
                                color: '#666'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            padding: 12,
                            titleFont: { size: 13 },
                            bodyFont: { size: 12 },
                            borderColor: '#ddd',
                            borderWidth: 1,
                            cornerRadius: 4,
                            callbacks: {
                                title: (items) => {
                                    const item = items[0];
                                    const xValue = item?.parsed?.x ?? item?.raw?.x;
                                    return xValue === undefined ? '' : formatHourLabel(xValue);
                                },
                                label: (context) => {
                                    const value = context.parsed?.y ?? context.raw?.y;
                                    return `${context.dataset.label}: ${Number(value).toFixed(2)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: 0,
                            max: 24,
                            display: true,
                            grid: {
                                display: true,
                                color: 'rgba(0, 0, 0, 0.05)',
                                drawBorder: false
                            },
                            ticks: {
                                stepSize: 2,
                                font: { size: 11 },
                                color: '#999',
                                callback: (value) => formatHourLabel(value)
                            },
                            title: {
                                display: true,
                                text: 'Uhrzeit',
                                font: { size: 12, weight: '600' },
                                color: '#333'
                            }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            min: 0,
                            title: {
                                display: true,
                                text: 'kW',
                                font: { size: 12, weight: '600' },
                                color: '#333'
                            },
                            grid: {
                                display: true,
                                color: 'rgba(0, 0, 0, 0.05)',
                                drawBorder: false
                            },
                            ticks: {
                                font: { size: 11 },
                                color: '#666'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            min: 0,
                            max: 100,
                            title: {
                                display: true,
                                text: '%',
                                font: { size: 12, weight: '600' },
                                color: '#333'
                            },
                            grid: {
                                drawOnChartArea: false
                            },
                            ticks: {
                                font: { size: 11 },
                                color: '#666'
                            }
                        }
                    }
                }
            });
        }

        function updateStats(latest) {
            if (latest) {
                document.getElementById('erzeugen').textContent = latest.erzeugen.toFixed(2);
                document.getElementById('eigennutzung').textContent = latest.eigennutzung.toFixed(2);
                document.getElementById('verbrauch').textContent = latest.verbrauch.toFixed(2);
                document.getElementById('ladezustand').textContent = latest.ladezustand.toFixed(1);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const selectedDateInput = document.getElementById('selectedDate');
            const prevDayButton = document.getElementById('prevDayButton');
            const nextDayButton = document.getElementById('nextDayButton');
            const downloadCsvButton = document.getElementById('downloadCsvButton');
            const rangeDownloadButton = document.getElementById('rangeDownloadButton');
            const rangeDialog = document.getElementById('rangeDialog');
            const rangeDownloadForm = document.getElementById('rangeDownloadForm');
            const closeRangeDialogButton = document.getElementById('closeRangeDialogButton');
            const rangeStartDate = document.getElementById('rangeStartDate');
            const rangeEndDate = document.getElementById('rangeEndDate');

            const today = new Date();
            const initialDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            selectedDateInput.value = initialDate;
            updateCurrentDate();

            selectedDateInput.addEventListener('change', function() {
                updateCurrentDate();
                loadData();
            });

            prevDayButton.addEventListener('click', function() {
                shiftSelectedDate(-1);
            });

            nextDayButton.addEventListener('click', function() {
                shiftSelectedDate(1);
            });

            downloadCsvButton.addEventListener('click', function() {
                downloadCsv().catch((error) => {
                    const errorDiv = document.getElementById('error');
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = 'Fehler beim Herunterladen der CSV-Datei: ' + error.message;
                    console.error(error);
                });
            });

            rangeDownloadButton.addEventListener('click', function() {
                rangeDialog.showModal();
                loadAvailableDateRange(rangeStartDate, rangeEndDate).catch((error) => {
                    rangeDialog.close();
                    const errorDiv = document.getElementById('error');
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = 'Fehler beim Laden des verfügbaren Zeitraums: ' + error.message;
                    console.error(error);
                });
            });

            closeRangeDialogButton.addEventListener('click', function() {
                rangeDialog.close();
            });

            rangeDownloadForm.addEventListener('submit', function(event) {
                event.preventDefault();
                const startDate = rangeStartDate.value;
                const endDate = rangeEndDate.value;

                if (startDate > endDate) {
                    rangeEndDate.setCustomValidity('Das Enddatum muss nach dem Startdatum liegen.');
                    rangeEndDate.reportValidity();
                    return;
                }

                rangeEndDate.setCustomValidity('');
                downloadRangeCsv(startDate, endDate)
                    .then(() => rangeDialog.close())
                    .catch((error) => {
                        const errorDiv = document.getElementById('error');
                        errorDiv.style.display = 'block';
                        errorDiv.textContent = 'Fehler beim Herunterladen der CSV-Datei: ' + error.message;
                        console.error(error);
                    });
            });

            loadData();
            // setInterval(loadData, 180000);
        });
    </script>
</body>
</html>
