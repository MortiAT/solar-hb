services:
  timescale: # this name is resolved and can be used by the other servers instead of an ip
    image: timescale/timescaledb:latest-pg18
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/pgdata
      - ./timescale/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    env_file: general.env

  postgrest:
    image: postgrest/postgrest:latest
    ports:
      - "3000:3000"
    env_file: general.env
    depends_on:
      - timescale
  
  etl:
    build: ./etl/
    env_file: general.env
    depends_on:
      - timescale

  webui:
    build: ./webui/
    ports:
      - "5000:5000"
    env_file: general.env
    volumes:
      - ./webui/templates:/usr/app/templates:ro # for updating templates without rebuilding the image
    depends_on:
      - timescale
      - postgrest


